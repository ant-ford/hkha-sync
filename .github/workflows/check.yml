name: Check

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q src tests

      # Offline: PostgREST is faked, no secrets are used.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
