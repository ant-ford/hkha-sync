name: HKHA Sync

on:
  # ── Automatic schedules ──────────────────────────────────────────────────
  schedule:
    # Phase 1 (fixtures only) every 6 hours — catches new fixtures quickly
    - cron: '0 */6 * * *'

    # Full sync (fixtures + match cards) daily at 19:30 UTC
    # Runs after most Hong Kong match days finish (HKT = UTC+8 → 03:30 HKT)
    - cron: '30 19 * * *'

    # Extended re-scrape every Sunday (catches late card / disciplinary updates)
    - cron: '0 2 * * 0'

  # ── Manual trigger (for testing and ad-hoc runs) ─────────────────────────
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to write'
        required: false
        default: 'supabase-production'
        type: choice
        options: [supabase-production, supabase-preview]
      dry_run:
        description: 'Supabase only: read and log, write nothing'
        required: false
        default: false
        type: boolean
      job:
        description: 'Job to run'
        required: false
        default: 'all'
        type: choice
        options: [all, fixtures, cards]
      source:
        description: 'Fixture source (fixtures job only)'
        required: false
        default: 'all'
        type: choice
        options: [all, public, mclist]
      lookback_days:
        description: 'Days to look back for match cards (default: 30)'
        required: false
        default: '30'
      log_level:
        description: 'Log verbosity'
        required: false
        default: 'INFO'
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR]

env:
  PYTHONPATH: .

jobs:
  sync:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Manual — {0} → {1}', inputs.job, matrix.target) || format('Scheduled Sync → {0}', matrix.target) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Scheduled runs write to the targets in the SYNC_TARGETS repository
    # variable (a JSON list, default ["supabase-production"]). Eddy left
    # Airtable on 2 Oct 2026, so Airtable is no longer a target.
    strategy:
      fail-fast: false
      max-parallel: 1       # one target at a time, so HKHA sees one scraper
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || vars.SYNC_TARGETS || '["supabase-production"]') }}

    concurrency:
      group: hkha-sync-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Determine arguments based on trigger ──────────────────────────────
      # schedule triggers don't have inputs, so we map by cron expression.
      # workflow_dispatch uses the provided inputs.
      - name: Resolve job arguments
        id: args
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}"               >> "$GITHUB_OUTPUT"
            echo "source=${{ inputs.source }}"         >> "$GITHUB_OUTPUT"
            echo "lookback=${{ inputs.lookback_days }}" >> "$GITHUB_OUTPUT"
            echo "log_level=${{ inputs.log_level }}"   >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}"       >> "$GITHUB_OUTPUT"
          else
            # Map each scheduled cron to sensible defaults.
            # All three schedule triggers run the same job step; the
            # differentiation is handled by the --job flag below.
            # For simplicity: all schedule runs do a full sync.
            echo "job=all"      >> "$GITHUB_OUTPUT"
            echo "source=all"   >> "$GITHUB_OUTPUT"
            echo "lookback=30"  >> "$GITHUB_OUTPUT"
            echo "log_level=INFO" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run sync
        env:
          SYNC_BACKEND:     supabase
          # eddy-production and eddy-preview. The URLs are not secret; the keys are.
          SUPABASE_URL: ${{ matrix.target == 'supabase-production' && 'https://biipqddulsbjpbmxuoss.supabase.co' || matrix.target == 'supabase-preview' && 'https://zlqzpzmqjqnrppmtevbv.supabase.co' || '' }}
          SUPABASE_SECRET_KEY: ${{ matrix.target == 'supabase-production' && secrets.PRODUCTION_SUPABASE_SECRET_KEY || matrix.target == 'supabase-preview' && secrets.PREVIEW_SUPABASE_SECRET_KEY || '' }}
          SUPABASE_DRY_RUN: ${{ steps.args.outputs.dry_run }}
          HKHA_PASSWORD:    ${{ secrets.HKHA_PASSWORD }}
          LOOKBACK_DAYS:    ${{ steps.args.outputs.lookback }}
        run: |
          python src/main.py \
            --job        ${{ steps.args.outputs.job }} \
            --source     ${{ steps.args.outputs.source }} \
            --lookback   ${{ steps.args.outputs.lookback }} \
            --log-level  ${{ steps.args.outputs.log_level }}
